name: keep-warm

# Free Hugging Face Spaces sleep after 48h of inactivity and cold-start on the
# next request. This pings the Space's /health endpoint on a schedule so it
# stays awake, plus a manual trigger you can run right before a demo.
#
# Setup: repo Settings → Secrets and variables → Actions → Variables, add
#   SPACE_URL = https://<user>-<space>.hf.space
# (Delete this workflow if you'd rather just let it sleep and accept the
# ~1 min wake delay on first hit.)

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # run manually before a demo

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Space health endpoint
        run: |
          URL="${{ vars.SPACE_URL }}"
          if [ -z "$URL" ]; then
            echo "Set the SPACE_URL repo variable to enable keep-warm."; exit 0
          fi
          echo "Pinging $URL/health"
          curl -fsS --max-time 60 "$URL/health" || echo "Ping failed (Space may be waking up)."
